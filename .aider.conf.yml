## Architect settings
architect: false
model: xai/grok-code-fast-1
editor-model: gemini/gemini-2.5-flash
weak-model: gemini/gemini-2.5-flash-lite

## Edit settings
edit-format: diff
# Use 'editor-diff' if you want Gemini to be even more surgical
# when acting as an editor. Saves tokens, avoid rethinking.
editor-edit-format: editor-whole

## Performance & UI
stream: false
show-diffs: true
map-tokens: 1024

## History & Context
# Since Grok-4-1 has a 2M context window, you can afford a larger history
max-chat-history-tokens: 32768
cache-prompts: true
detect-urls: false

# --- Automation & Testing ---
# Replace 'pytest' or 'npm test' with your specific test command
test-cmd: "cd ingestion/synthetic-meat/ && uv run pytest"
auto-test: false
auto-lint: false

read:
  - README.md
  - infra/DEPLOYMENT.md
  - infra/INFRA.md
  - infra/main.tf
  - infra/prod.tfvars.template
  - warehouse/BRONZE_TO_SILVER_STRATEGY.md
  - .github/workflows/deploy.yml
