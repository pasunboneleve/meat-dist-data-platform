name: Deploy Warehouse Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'warehouse/**'
      - 'ingestion/synthetic-meat/**'
      - '.github/workflows/deploy.yml'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}

jobs:
  deploy:
    name: Deploy Warehouse
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Google Auth
      id: auth
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.GCP_WORKLOAD_IDENTITY_POOL }}/providers/${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
        service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
        audience: 'sts.googleapis.com'

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Build and Package Ingestion Function
      run: |
        # Ensure the root dist directory exists for the final zip artifact.
        mkdir -p ${{ github.workspace }}/dist

        # Create a source distribution (sdist) which respects pyproject.toml definitions.
        cd ${{ github.workspace }}/ingestion/synthetic-meat
        uv build --sdist --out-dir dist

        # Cloud Functions requires a zip file, so we convert the .tar.gz sdist to .zip
        cd dist
        SDIST_TGZ=$(find . -name "*.tar.gz")
        tar -xvf "$SDIST_TGZ"
        SDIST_DIR=$(basename "$SDIST_TGZ" .tar.gz)
        cd "$SDIST_DIR"
        zip -r ${{ github.workspace }}/dist/synthetic-meat-ingestor.zip .

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: latest

    - name: Tofu Init
      id: init
      run: tofu init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="prefix=${GCP_PROJECT_ID}/warehouse"
      working-directory: warehouse

    - name: Tofu Plan
      id: plan
      run: tofu plan -var="project_id=${GCP_PROJECT_ID}" -var="region=${GCP_REGION}" -out=tfplan
      working-directory: warehouse

    - name: Tofu Apply
      run: tofu apply -auto-approve tfplan
      working-directory: warehouse
