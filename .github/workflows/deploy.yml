name: Deploy Warehouse Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'warehouse/**'
      - 'ingestion/synthetic-meat/**'
      - '.github/workflows/deploy.yml'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_APP_ENGINE_REGION: ${{ secrets.GCP_APP_ENGINE_REGION }}

jobs:
  deploy:
    name: Deploy Warehouse
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Google Auth
      id: auth
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.GCP_WORKLOAD_IDENTITY_POOL }}/providers/${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
        service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
        audience: 'sts.googleapis.com'

    # - name: Wait for IAM propagation
    #   run: sleep 30s
    #   shell: bash

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: latest

    - name: Tofu Init
      id: init
      run: |
        tofu init -upgrade -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="prefix=${GCP_PROJECT_ID}/warehouse"
      working-directory: warehouse

    - name: Tofu Plan (initial)
      id: plan_initial
      run: tofu plan -var="project_id=${GCP_PROJECT_ID}" -var="region=${GCP_REGION}" -var="project_number=${GCP_PROJECT_NUMBER}" -var="app_engine_region=${GCP_APP_ENGINE_REGION}" -out=tfplan
      working-directory: warehouse

    - name: Tofu Apply (initial)
      run: tofu apply -auto-approve tfplan
      working-directory: warehouse

    - name: Build and Push Docker Image
      run: |
        gcloud auth configure-docker ${GCP_REGION}-docker.pkg.dev
        IMAGE_TAG=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/docker-images/synthetic-meat-ingestor:${{ github.sha }}
        docker build -t $IMAGE_TAG ./ingestion/synthetic-meat
        docker push $IMAGE_TAG
        echo "IMAGE_URI=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Tofu Plan (service update)
      id: plan_update
      run: tofu plan -var="project_id=${GCP_PROJECT_ID}" -var="region=${GCP_REGION}" -var="project_number=${GCP_PROJECT_NUMBER}" -var="app_engine_region=${GCP_APP_ENGINE_REGION}" -var="image_uri=${{ env.IMAGE_URI }}" -out=tfplan
      working-directory: warehouse

    - name: Tofu Apply (service update)
      run: tofu apply -auto-approve tfplan
      working-directory: warehouse
