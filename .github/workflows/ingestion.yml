name: Ingestion Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ingestion/**'
      - '.github/workflows/ingestion.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ingestion/**'
      - '.github/workflows/ingestion.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Google Auth
      id: auth
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.GCP_WORKLOAD_IDENTITY_POOL }}/providers/${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
        service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
        audience: 'sts.googleapis.com'

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      working-directory: ./ingestion/synthetic-meat
      run: |
        uv venv
        uv sync --locked --group dev

    - name: Run tests
      working-directory: ./ingestion/synthetic-meat
      run: |
        uv run pytest -v
