name: Ingestion Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ingestion/**'
      - '.github/workflows/ingestion.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ingestion/**'
      - '.github/workflows/ingestion.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      working-directory: ./ingestion/synthetic-meat
      run: |
        uv venv
        uv pip sync --extra dev

    - name: Run tests
      working-directory: ./ingestion/synthetic-meat
      run: |
        uv run pytest
