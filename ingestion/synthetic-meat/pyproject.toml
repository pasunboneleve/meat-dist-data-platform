[project]
name = "synthetic-meat"
version = "0.1.0"
description = "Synthetic data generator for meat processing data."
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "faker>=20.0.0",
    "gcsfs>=2023.0.0",
    "google-cloud-storage>=2.0.0",
    "functions-framework>=3.0.0",
    "requests>=2.30.0"
]

[project.scripts]
synthetic-meat = "src.synthesise:generate_and_upload"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = "."
