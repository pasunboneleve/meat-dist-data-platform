[project]
name = "synthetic-meat"
version = "0.1.0"
description = "Synthetic data generator for meat processing data."
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20.0",
    "pyarrow>=16.0.0",
    "faker>=20.0.0",
    "gcsfs>=2023.0.0",
    "google-cloud-storage>=2.0.0",
    "functions-framework>=3.0.0",
    "requests>=2.30.0",
    "structlog>=25.5.0",
]

[project.scripts]
synthetic-meat = "src.synthesise:generate_and_upload"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = "."

[tool.uv]
package = true
